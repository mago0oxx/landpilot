services:
  postgres:
    image: postgres:16
    container_name: landpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: landpilot
    ports:
      - "5432:5432"
    volumes:
      - landpilot-postgres-data:/var/lib/postgresql/data

volumes:
  landpilot-postgres-data:
